name: Syntax Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: |
          node --check server.js
          node --check enhanced-server.js
          node --check mega-server.js
          node --check src/commerce-intelligence.js
          node --check src/daily-gemini-auto.js
      - name: Check browser client syntax
        run: |
          node --check public/app.js
          node --check public/features.js
          node --check public/mega-features.js
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
